[project]
name = "ismir2026-sop"
version = "0.1.0"
description = "Static site for the ISMIR 2026 session standard procedures (SOP)"
readme = "README.md"
authors = [
    { name = "Daniel Chin", email = "daniel.chin@nyu.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "markdown>=3.11.2",
]

[project.scripts]
ismir2026-sop = "ismir2026_sop:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
